{% extends 'base.html' %}
{% block title %}{{ 'Edit' if student else 'Add' }} Student - LIMS{% endblock %}
{% block content %}
<h3 class="mb-3">{{ 'Edit' if student else 'Add' }} Student</h3>
<div class="card shadow-sm">
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" value="{{ student.name if student else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Roll Number</label>
        <input type="text" name="roll_number" class="form-control" value="{{ student.roll_number if student else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ student.email if student else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Department</label>
        <input type="text" name="department" class="form-control" value="{{ student.department if student else '' }}">
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{{ url_for('students') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
