{% extends 'base.html' %}
{% block title %}{{ 'Edit' if book else 'Add' }} Book - LIMS{% endblock %}
{% block content %}
<h3 class="mb-3">{{ 'Edit' if book else 'Add' }} Book</h3>
<div class="card shadow-sm">
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-control" value="{{ book.title if book else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Author</label>
        <input type="text" name="author" class="form-control" value="{{ book.author if book else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">ISBN</label>
        <input type="text" name="isbn" class="form-control" value="{{ book.isbn if book else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Category</label>
        <input type="text" name="category" class="form-control" value="{{ book.category if book else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Total Copies</label>
        <input type="number" min="1" name="total_copies" class="form-control"
               value="{{ book.total_copies if book else 1 }}" required>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{{ url_for('books') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
